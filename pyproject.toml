[project]
name = "Arachnidium"
version = "0.1.0"
description = "Self-hosted HTTP optimization/compression proxy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "backports-zstd>=1.7.0",
    "brotli>=1.2.0",
    "mitmproxy>=12.2.3",
    "pillow>=12.3.0",
    "qrcode[pil]>=8.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
